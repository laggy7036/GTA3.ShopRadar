name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Zig toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile tools/zig.zip
          $expected='3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c'
          if ((Get-FileHash tools/zig.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Zig checksum mismatch' }
          Expand-Archive -LiteralPath tools/zig.zip -DestinationPath tools
      - name: Test and build ASI
        shell: pwsh
        run: ./build.ps1
      - name: Check publication candidate and release contents
        shell: pwsh
        run: |
          ./tests/publication.ps1
          ./scripts/check-publication.ps1 -ReleaseZip ./dist/GTA3.ShopRadar-0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GTA3.ShopRadar-beta
          path: |
            dist/GTA3.ShopRadar-0.1.0.zip
            dist/GTA3.ShopRadar-0.1.0.zip.sha256
