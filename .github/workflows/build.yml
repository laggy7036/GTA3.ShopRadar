name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download pinned Zig toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile tools/zig.zip
          $expected='3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c'
          if ((Get-FileHash tools/zig.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Zig checksum mismatch' }
          Expand-Archive -LiteralPath tools/zig.zip -DestinationPath tools
      - name: Test and build ASI
        shell: pwsh
        run: ./build.ps1
      - name: Check publication candidate and release contents
        shell: pwsh
        run: |
          ./tests/publication.ps1
          $version=(Get-Content -LiteralPath VERSION -Raw).Trim()
          ./scripts/check-publication.ps1 -ReleaseZip "./dist/GTA3.ShopRadar-$version.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GTA3.ShopRadar-beta
          path: |
            dist/GTA3.ShopRadar-*.zip
            dist/GTA3.ShopRadar-*.zip.sha256
  sanitizers:
    # Linux job: rebuilds the portable test suites with memory and undefined-behaviour checkers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Policy and discovery tests under AddressSanitizer and UBSan
        run: |
          set -e
          for t in policy discovery; do
            clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              "tests/$t.cpp" -o "$t"
            "./$t"
          done
